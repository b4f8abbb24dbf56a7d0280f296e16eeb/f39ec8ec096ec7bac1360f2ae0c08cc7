[package]
name = "nx2ipa-ios-shell"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true, features = ["std"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes"] }
objc2-foundation = { workspace = true, features = ["std", "NSObject", "NSString", "NSBundle"] }
objc2-quartz-core = { workspace = true, features = ["std", "CALayer", "CAMetalLayer", "objc2-core-foundation"] }
objc2-ui-kit = { workspace = true, features = ["std", "UIApplication", "UIResponder", "UIView", "UIViewController", "UIWindow", "UIScene", "UISceneSession", "UISceneConfiguration", "UISceneOptions", "UISceneDefinitions", "UIWindowScene", "UIScreen", "UIColor", "UILabel", "NSParagraphStyle", "objc2-quartz-core", "objc2-core-foundation"] }

[dev-dependencies]
nxkit_svc_input = { package = "nx2ipa-ios-input", path = "../input" }
nxkit_svc_audio = { package = "nx2ipa-ios-audio", path = "../audio" }
