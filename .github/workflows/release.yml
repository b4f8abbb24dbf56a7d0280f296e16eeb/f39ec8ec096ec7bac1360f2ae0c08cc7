name: Build and deploy nx2ipa
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun scripts/source.mjs
      - name: Build the thin WASM bridge from unmodified nxkit
        run: cargo build --manifest-path bridge/Cargo.toml --locked --release --target wasm32-unknown-unknown
        env:
          RUSTFLAGS: --cap-lints warn
      - name: Build the development preview without a synthetic host
        run: bun scripts/build.mjs --allow-missing-host
      - name: Test the release library in Bun
        run: bun run test
      - run: bun scripts/release.mjs --preview
      - run: cp bridge/target/wasm32-unknown-unknown/release/nx2ipa_bridge.wasm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: nx2ipa-bootstrap
          path: dist/
          if-no-files-found: error
  ios:
    name: Build and test the native iOS host
    needs: build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: rustup toolchain install 1.99.0 --profile minimal --target aarch64-apple-ios
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun scripts/source.mjs
      - uses: actions/download-artifact@v4
        with:
          name: nx2ipa-bootstrap
          path: dist
      - run: mkdir -p bridge/target/wasm32-unknown-unknown/release && mv dist/nx2ipa_bridge.wasm bridge/target/wasm32-unknown-unknown/release/
      - name: Build an unsigned test host and exact corresponding source
        run: cargo fetch --locked --manifest-path ios/Cargo.toml && bun tests/native-build.mjs && bun ios/tests/artifact.mjs && bun scripts/build-ios.mjs --test-artifact
        env:
          RUSTFLAGS: --cap-lints warn
      - name: Test actual host packaging, synthetic signing and native bundle contract
        run: PATH="$(brew --prefix openssl@3)/bin:$PATH" bun tests/native-host.mjs
        env:
          RUSTFLAGS: --cap-lints warn
      - name: Embed the verified host as explicitly experimental
        run: bun scripts/build.mjs --experimental-host
      - name: Test the final embedded-host JS in Bun
        run: bun run test && PATH="$(brew --prefix openssl@3)/bin:$PATH" bun tests/native-host.mjs
        env:
          RUSTFLAGS: --cap-lints warn
      - run: bunx --no-install playwright install chromium
      - name: Test the same final JS and game-plus-keys page in Chromium
        run: bun tests/browser.mjs && bun tests/ui.mjs
      - run: bun scripts/release.mjs --experimental-host
      - run: tar -czf .build/ios/native-test-only.tar.gz -C .build/ios test
      - uses: actions/upload-artifact@v4
        with:
          name: nx2ipa-native-test-only
          path: .build/ios/native-test-only.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nx2ipa-site
          path: dist/
          if-no-files-found: error
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: ios
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: nx2ipa-site
          path: dist
      - run: mv dist/nx2ipa.html dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
